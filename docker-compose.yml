version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16.13-alpine
    container_name: saasconf_db
    environment:
      POSTGRES_USER: saasconf
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saasconf_dev_password}
      POSTGRES_DB: saasconf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saasconf -d saasconf"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and rate limiting
  redis:
    image: redis:7.4-alpine
    container_name: saasconf_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: saasconf_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://saasconf:${DB_PASSWORD:-saasconf_dev_password}@db:5432/saasconf
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@saasconf.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-changeme123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build: ./frontend
    container_name: saasconf_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
