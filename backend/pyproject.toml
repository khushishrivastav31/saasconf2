[tool.poetry]
name = "saasconf-backend"
version = "0.1.0"
description = "SaaSConf - Multi-tenant SaaS platform for conference management"
authors = ["SaaSConf Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
# Web framework
fastapi = "0.136.1"
uvicorn = {version = "0.47.0", extras = ["standard"]}
starlette = "0.52.1"
python-multipart = "0.0.29"
# Database
sqlalchemy = "2.0.49"
asyncpg = "0.31.0"
psycopg2-binary = "2.9.12"
alembic = "1.18.4"
redis = "7.4.0"
# Auth & security
PyJWT = {version = "2.12.1", extras = ["crypto"]}
argon2-cffi = "25.1.0"
pyotp = "2.9.0"
qrcode = "8.2"
cairosvg = "2.9.0"
# Validation
pydantic = "2.13.3"
pydantic-settings = "2.14.2"
email-validator = "2.3.0"
phonenumbers = "9.0.29"
python-stdnum = "2.2"
schwifty = "2026.3.0"
pycountry = "26.2.16"
# PDF & document generation
weasyprint = "68.1"
fpdf2 = "2.8.7"
factur-x = "4.2"
pypdf = "6.13.3"
openpyxl = "3.1.5"
mammoth = "1.12.0"
striprtf = "0.0.32"
python-docx = "1.2.0"
html2docx = "1.6.0"
lxml = "6.1.1"
# Payments
stripe = "15.1.0"
# Infrastructure
slowapi = "0.1.9"
sentry-sdk = {version = "2.59.0", extras = ["fastapi"]}
python-json-logger = "4.1.0"
python-dotenv = "1.2.2"
httpx = "0.28.1"
prometheus-fastapi-instrumentator = "7.1.0"
geonamescache = "3.0.1"
# Media & files
filetype = "1.2.0"
Pillow = "12.2.0"
nh3 = "0.3.5"
resend = "2.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.3.0"
pytest-cov = "7.1.0"
pytest-xdist = "3.8.0"
ruff = "0.15.13"
mypy = "1.20.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E712",   # comparison to True/False (intentional in SQLAlchemy filters)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends pattern)
    "UP007",  # Use X | Y for unions (keep Optional for readability)
    "B027",   # empty method without abstract decorator (intentional optional override hooks)
    "SIM102", # collapsible if — keep nested ifs for readability in validation logic
    "RUF001", # ambiguous unicode in strings (intentional: ×, –)
    "RUF003", # ambiguous unicode in comments (intentional: ×, –)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

# Third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "nh3",
    "phonenumbers",
    "phonenumbers.*",
    "prometheus_fastapi_instrumentator",
    "slowapi",
    "slowapi.*",
    "pythonjsonlogger",
    "pythonjsonlogger.*",
    "filetype",
    "resend",
    "resend.*",
    "stdnum",
    "stdnum.*",
    "mammoth",
    "fpdf",
    "fpdf.*",
    "striprtf",
    "striprtf.*",
    "docx",
    "docx.*",
    "html2docx",
    "weasyprint",
    "weasyprint.*",
    "facturx",
    "facturx.*",
    "lxml",
    "lxml.*",
    "cairosvg",
    "qrcode",
    "qrcode.*",
    "pyotp",
    "schwifty",
    "schwifty.*",
    "pycountry",
    "pycountry.*",
    "geonamescache",
    "geonamescache.*",
    "stripe",
    "stripe.*",
    "pypdf",
    "pypdf.*",
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true

# Alembic migrations — auto-generated, skip type checking
[[tool.mypy.overrides]]
module = "app.db.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "no_mock_email: opt out of the autouse _mock_resend_client fixture",
    "legacy_truncate: opt out of savepoint-per-test isolation (use TRUNCATE+commit instead) — for tests that exercise commit/rollback semantics directly or need cross-transaction visibility",
    # Tests that spawn alembic subprocesses (full migration chain up/down)
    # or otherwise take tens of seconds on their own. Skipped on PR events
    # in CI via ``-m "not slow"`` to keep feedback fast; push-to-main runs
    # the full suite including these. As of 2026-04-24, the two slow test
    # modules (``test_dashboard_matviews``, ``test_rls_coverage``) account
    # for ~17 of ~19 minutes of local wall time.
    "slow: runs full alembic migration cycles; skipped on PR events",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/__pycache__/*"]

[tool.coverage.report]
# Ratchet: CI was green at 50 on 2026-04-17. Bumping to 55 to block silent
# regressions while giving Phase G test-writing room to land before we
# target 70. Do not lower this value; only raise it.
fail_under = 55
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
