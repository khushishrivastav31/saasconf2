[tool.poetry]
name = "saasconf-backend"
version = "0.1.0"
description = "SaaSConf - Multi-tenant SaaS platform for conference management"
authors = ["SaaSConf Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
# Web framework
fastapi = "0.135.1"
uvicorn = {version = "0.41.0", extras = ["standard"]}
starlette = "0.52.1"
python-multipart = "0.0.22"
# Database
sqlalchemy = "2.0.48"
asyncpg = "0.31.0"
psycopg2-binary = "2.9.11"
alembic = "1.18.4"
redis = "7.3.0"
# Auth & security
PyJWT = {version = "2.12.0", extras = ["crypto"]}
argon2-cffi = "25.1.0"
pyotp = "2.9.0"
qrcode = "8.0"
cairosvg = "2.9.0"
# Validation
pydantic = "2.12.5"
pydantic-settings = "2.13.1"
email-validator = "2.3.0"
phonenumbers = "9.0.25"
python-stdnum = "2.2"
schwifty = "2026.3.0"
pycountry = "26.2.16"
# PDF & document generation
weasyprint = "68.1"
fpdf2 = "2.8.3"
factur-x = "3.15"
pypdf = "6.9.1"
openpyxl = "3.1.5"
mammoth = "1.11.0"
striprtf = "0.0.29"
python-docx = "1.2.0"
html2docx = "1.6.0"
lxml = "6.0.2"
# Payments
stripe = "14.4.1"
# Infrastructure
slowapi = "0.1.9"
sentry-sdk = {version = "2.54.0", extras = ["fastapi"]}
python-json-logger = "4.0.0"
python-dotenv = "1.2.2"
httpx = "0.28.1"
prometheus-fastapi-instrumentator = "7.1.0"
geonamescache = "3.0.0"
# Media & files
filetype = "1.2.0"
Pillow = "12.1.1"
nh3 = "0.3.3"
resend = "2.23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.0"
pytest-cov = "^5.0"
ruff = "^0.8"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E712",   # comparison to True/False (intentional in SQLAlchemy filters)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends pattern)
    "UP007",  # Use X | Y for unions (keep Optional for readability)
    "B027",   # empty method without abstract decorator (intentional optional override hooks)
    "SIM102", # collapsible if — keep nested ifs for readability in validation logic
    "RUF001", # ambiguous unicode in strings (intentional: ×, –)
    "RUF003", # ambiguous unicode in comments (intentional: ×, –)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

# Third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "nh3",
    "phonenumbers",
    "phonenumbers.*",
    "prometheus_fastapi_instrumentator",
    "slowapi",
    "slowapi.*",
    "pythonjsonlogger",
    "pythonjsonlogger.*",
    "filetype",
    "resend",
    "resend.*",
    "stdnum",
    "stdnum.*",
    "mammoth",
    "fpdf",
    "fpdf.*",
    "striprtf",
    "striprtf.*",
    "docx",
    "docx.*",
    "html2docx",
    "weasyprint",
    "weasyprint.*",
    "facturx",
    "facturx.*",
    "lxml",
    "lxml.*",
    "cairosvg",
    "qrcode",
    "qrcode.*",
    "pyotp",
    "schwifty",
    "schwifty.*",
    "pycountry",
    "pycountry.*",
    "geonamescache",
    "geonamescache.*",
    "stripe",
    "stripe.*",
    "pypdf",
    "pypdf.*",
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true

# Alembic migrations — auto-generated, skip type checking
[[tool.mypy.overrides]]
module = "app.db.migrations.*"
ignore_errors = true

# API route modules — `arg-type` stays suppressed pending `UUID | None` narrowing
# across conference/location dependency helpers (separate cleanup PR).
# `unaccent_ilike` signature was widened in app/core/search.py (2026-04).
[[tool.mypy.overrides]]
module = "app.api.v1.*"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "no_mock_email: opt out of the autouse _mock_resend_client fixture",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/__pycache__/*"]

[tool.coverage.report]
# Ratchet: CI was green at 50 on 2026-04-17. Bumping to 55 to block silent
# regressions while giving Phase G test-writing room to land before we
# target 70. Do not lower this value; only raise it.
fail_under = 55
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
