# Per-environment values for staging — the single source of truth.
#
# Read by TWO consumers, so keep every line a plain `key=value` with no quotes
# and no inline comments:
#
#   1. Ansible — loaded as inventory vars for the STAGING group, used in
#      docker-compose.j2 and nginx-saasconf.conf.j2.
#   2. CI (.github/workflows/staging.yml) — greps `vite_api_url` to pass as
#      `--build-arg VITE_API_URL` when building the frontend image.
#
# Why CI needs it: Vite inlines VITE_API_URL into the JS bundle at BUILD time
# (frontend/Dockerfile.prod takes it as ARG). It cannot be supplied at deploy
# time, which is why staging and production need distinct frontend image tags.
# Changing it means a rebuild, not a restart.
#
# Host ports: 8000 is taken by trendig-backend-1 on this shared box. 8001 and
# 8081 are free. Both bind 127.0.0.1 so the internet cannot bypass host nginx.

# ── Cutover ──────────────────────────────────────────────────────────────────
# We stand up and verify on a temporary hostname, then switch to the real
# staging domain once the box is proven. At cutover, swap the three values
# below AND rebuild the frontend image — VITE_API_URL is baked in at build
# time, so a DNS change alone leaves the SPA calling the old API host.
#
#   domain=staging.sonrisa.ventures
#   api_domain=api.staging.sonrisa.ventures
#   vite_api_url=https://api.staging.sonrisa.ventures
#
# Also update FRONTEND_BASE_URL and PORTAL_BASE_URL in the server's .env —
# they build the links in outbound email.
# ─────────────────────────────────────────────────────────────────────────────

[STAGING:vars]
domain=devsaasconf.bjvsoft.net
domain_www=www.devsaasconf.bjvsoft.net
api_domain=api.devsaasconf.bjvsoft.net
# Let's Encrypt sends expiry warnings here — must be a mailbox someone reads.
# Matches ACME_EMAIL in the staging .env (confirmed 2026-07-09).
acme_email=jose.diaz@sonrisa.ventures
vite_api_url=https://api.devsaasconf.bjvsoft.net
backend_port=8001
frontend_port=8081
image_tag=staging
app_root=/home/deploy/saasconf
ghcr_backend_image=ghcr.io/pepediaz/saasconf-backend
ghcr_frontend_image=ghcr.io/pepediaz/saasconf-frontend
