[defaults]
inventory = inventory
gathering = smart
roles_path = roles
nocows = 1
# Trendig's ansible.cfg sets `stdout_callback = debug`. That plugin ships with
# the full `ansible` package's older bundled collections — it does NOT exist in
# ansible-core (2.16 or 2.17), nor in community.general 13.x. We install
# ansible-core (community.docker 5.x refuses core 2.16), so `debug` would abort
# every run with:
#     ERROR! Invalid callback for stdout specified: debug
# `default` is built in and prints the same task-by-task output.
stdout_callback = default
force_handlers = True
host_key_checking = False
host_key_check = False

[ssh_connection]
ssh_args = -o ForwardAgent=no -o ControlMaster=auto -o StrictHostKeyChecking=no -o ControlPersist=300s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
