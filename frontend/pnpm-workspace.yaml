# pnpm 11+ approval list for postinstall build scripts. Mirrors the
# legacy ``package.json#pnpm.onlyBuiltDependencies`` allowlist —
# adding a package here lets its install scripts run. Every other dep's
# postinstall is blocked, blunting supply-chain attacks.
allowBuilds:
  esbuild: true

# pnpm 11+ canonical location for force-resolving transitive deps.
# Mirrors the legacy ``package.json#pnpm.overrides``. Without this
# duplication, pnpm 11 only applies the package.json overrides to
# top-level resolutions, leaving stale CVE-vulnerable copies (e.g.
# d3-color@2.0.0 reachable via recharts → victory-vendor → d3-scale)
# in the lockfile alongside the patched 3.x.
overrides:
  d3-color: '>=3.1.0'
  dompurify: '>=3.3.2'
