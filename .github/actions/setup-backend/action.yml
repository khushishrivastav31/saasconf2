name: Setup Backend
description: Install Python, WeasyPrint system deps, and pip packages.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Install system dependencies (WeasyPrint)
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: >-
          libpango-1.0-0
          libpangocairo-1.0-0
          libpangoft2-1.0-0
          libcairo2
          libgdk-pixbuf-2.0-0
          libffi-dev
          libglib2.0-0
          fonts-dejavu-core
        version: 1.0

    - name: Install Python dependencies
      shell: bash
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
