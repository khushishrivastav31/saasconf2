name: Staging CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_HOST: 46.225.88.254
  STAGING_USER: deploy
  STAGING_PATH: /opt/saasconf/app

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend Tests
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: backend
        run: |
          pip install ruff==0.15.5
          ruff check app/
          ruff format --check app/

      - name: Type check with mypy
        working-directory: backend
        run: |
          pip install mypy==1.19.1
          rm -rf .mypy_cache
          mypy app/ --config-file=pyproject.toml

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=50

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Frontend Tests
  # ─────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint src/ --max-warnings 0

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage -- --run --reporter=verbose

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.staging.sonrisa.ventures
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Dependency Security Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Scan for vulnerabilities in Dockerfiles
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ─────────────────────────────────────────────────────────────
  # Secrets Scanning
  # ─────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.93.7
        with:
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────
  # Deploy to Staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-audit, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude 'venv' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            backend/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/backend/

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/frontend/

      - name: Deploy configuration
        run: |
          rsync -avz \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/staging/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/deploy/staging/

      - name: Tag previous images for rollback
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Tag current images as :previous for rollback
            for svc in backend frontend; do
              img=$(docker compose images $svc --format json 2>/dev/null | head -1 | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Repository',''))" 2>/dev/null || true)
              if [ -n "$img" ]; then
                docker tag "$img:latest" "$img:previous" 2>/dev/null || true
                echo "Tagged $img:latest → $img:previous"
              fi
            done
          EOF

      - name: Reset database for PG16 (one-time fix)
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Check if db is healthy — if not, reset the volume for a clean PG16 start
            if ! docker exec saasconf_db_staging pg_isready -U saasconf 2>/dev/null; then
              echo "Database unhealthy — resetting volume for clean PG16 start..."
              docker compose down db 2>/dev/null || true
              docker rm -f saasconf_db_staging 2>/dev/null || true

              # Remove the postgres volume (try all possible prefix names)
              for vol in $(docker volume ls --format '{{.Name}}' | grep postgres_data); do
                echo "Removing volume: $vol"
                docker volume rm "$vol" 2>/dev/null || true
              done

              echo "Volume reset complete. PG16 will start fresh."
            else
              echo "Database is healthy — no reset needed."
            fi
          EOF

      - name: Rebuild and restart containers
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Ensure infrastructure services are running and healthy
            docker compose up -d --wait db redis

            # Rebuild application containers
            docker compose build --no-cache backend frontend

            # Restart app services only (--no-deps prevents recreating db/redis)
            docker compose up -d --force-recreate --no-deps backend frontend nginx

            # Wait for backend to be healthy before running migrations
            echo "Waiting for backend to be healthy..."
            sleep 15

            # Run database migrations — fail the deploy if migrations fail
            echo "Running database migrations..."
            docker compose exec -T backend alembic upgrade head
          EOF

      - name: Seed platform data
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'SEED_EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging
            echo "Seeding platform data..."
            docker compose exec -T backend python -u -m app.db.seed 2>&1
            echo "Seed exit code: $?"
            echo "Container status:"
            docker compose ps
          SEED_EOF

      - name: Verify containers are running
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            echo "=== Container Status ==="
            docker compose ps

            echo ""
            echo "=== Backend Logs (last 30 lines) ==="
            docker compose logs --tail=30 backend

            echo ""
            echo "=== Nginx Logs (last 15 lines) ==="
            docker compose logs --tail=15 nginx

            echo ""
            echo "=== Local Backend Health Check ==="
            curl -sv http://localhost:8000/health 2>&1 || true

            echo ""
            echo "=== Local Backend via Docker Network ==="
            docker compose exec -T backend curl -sf http://localhost:8000/health || echo "Backend health endpoint unreachable inside container"
          EOF

      - name: Health check
        run: |
          echo "Waiting for services to stabilize..."
          sleep 10

          # Retry health checks up to 5 times with 10s intervals
          for i in 1 2 3 4 5; do
            echo "Health check attempt $i/5..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.staging.sonrisa.ventures/health 2>&1) || true
            echo "  HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend is healthy"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Backend health check failed after 5 attempts"
              echo "=== Full curl output ==="
              curl -sv --max-time 10 https://api.staging.sonrisa.ventures/health 2>&1 || true
              exit 1
            fi
            sleep 10
          done

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://staging.sonrisa.ventures 2>&1) || true
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Frontend is healthy"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Frontend health check failed after 5 attempts (last status: $HTTP_CODE)"
              curl -sv --max-time 10 https://staging.sonrisa.ventures 2>&1 || true
              exit 1
            fi
            sleep 10
          done

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: https://staging.sonrisa.ventures"
          echo "Backend: https://api.staging.sonrisa.ventures"

  # ─────────────────────────────────────────────────────────────
  # E2E Tests (against staging)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Create auth storage directory
        working-directory: frontend
        run: mkdir -p playwright/.auth

      - name: Seed E2E test data
        working-directory: frontend
        env:
          E2E_API_URL: https://api.staging.sonrisa.ventures
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx tsx e2e/seed/setup-staging-data.ts

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://staging.sonrisa.ventures
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
          E2E_CONFERENCE_ID: ${{ secrets.E2E_CONFERENCE_ID }}
          E2E_CONFERENCE_NAME: ${{ secrets.E2E_CONFERENCE_NAME }}
          E2E_API_URL: https://api.staging.sonrisa.ventures
          E2E_PORTAL_PATH: /demo/portal
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
