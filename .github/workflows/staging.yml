name: Staging CI/CD

on:
  # ``push`` is still main-only — we don't want feature branches burning
  # CI minutes on every direct push.
  push:
    branches: [main]
  # ``pull_request`` intentionally has NO ``branches:`` filter: that filter
  # matches the *base* branch, which means stacked PRs (e.g. targeting
  # ``perf/scale-indexes`` instead of ``main``) were silently skipping CI.
  # Including ``edited`` in ``types`` so retargeting a PR's base branch
  # (``gh pr edit --base main``) also fires CI — otherwise the first CI run
  # on a newly-retargeted PR never starts until a separate push happens.
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}
  STAGING_PATH: ${{ secrets.STAGING_PATH }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Detect which areas changed
  # ─────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # CI-config edits must revalidate the backend suite — the
              # pytest invocation + env live here, and regressions in the
              # workflow (e.g. a broken --cov toggle) are only catchable
              # by actually running the tests.
              - '.github/workflows/staging.yml'
            frontend:
              - 'frontend/src/**'
              - 'frontend/e2e/**'
              - 'frontend/package*.json'
              - 'frontend/tsconfig*.json'
              - 'frontend/vite.config.*'
              - 'frontend/eslint.config.*'
              # Same rationale as the backend filter: re-run on CI edits.
              - '.github/workflows/staging.yml'

  # ─────────────────────────────────────────────────────────────
  # Backend Tests
  # On PR: path-filtered (only when backend/ changed) — fast feedback.
  # On push to main or manual dispatch: always run — the full pipeline
  # must exercise every suite before a deploy.
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
          --shm-size 1g

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (WeasyPrint)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          # Cached across runs — saves ~90s vs. cold apt-get install.
          packages: >-
            libpango-1.0-0
            libpangocairo-1.0-0
            libpangoft2-1.0-0
            libcairo2
            libgdk-pixbuf-2.0-0
            libffi-dev
            libglib2.0-0
            fonts-dejavu-core
          version: 1.0

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        working-directory: backend
        run: |
          pip install ruff==0.15.5
          ruff check app/
          ruff format --check app/

      - name: Cache mypy type-check results
        uses: actions/cache@v5
        with:
          path: backend/.mypy_cache
          # Invalidate on requirements (deps drive type surface) + app/ changes
          # (mypy caches per-file hash internally, so this is best-effort).
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('backend/requirements.txt', 'backend/pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-

      - name: Type check with mypy
        working-directory: backend
        run: |
          pip install mypy==1.19.1
          mypy app/ --config-file=pyproject.toml

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: |
          # -n auto spreads the 3,000+ tests across all available cores.
          # Each xdist worker gets its own per-worker test database via
          # conftest.py (PYTEST_XDIST_WORKER → test_gwN), so the per-test
          # TRUNCATE loop stays isolated.
          #
          # ``--dist=worksteal`` (xdist 3.0+): hands tests out one at a
          # time and lets idle workers steal pending tests from busy ones.
          # We previously used ``loadfile`` which keeps an entire file on
          # one worker — a single large file becomes a wall-time floor.
          # ``worksteal`` rebalances at runtime and trims the long-tail
          # worker; the win compounds when we move to 4+ core runners.
          # No -v: parallel output is noisy and hard to read.
          #
          # Coverage.py is a ~25-40% tax. We only pay it on push-to-main
          # runs (which upload to Codecov); PR events skip it to keep CI
          # feedback fast. --durations=50 prints the slowest 50 tests so
          # we can spot structural slowdowns as the suite grows.
          #
          # ``-m "not slow"`` deselects the two migration-chain integrity
          # tests (test_dashboard_matviews, test_rls_coverage) that each
          # spawn ``alembic upgrade/downgrade`` subprocesses and collectively
          # consume ~17 min of wall time on their own. They run in parallel
          # in the ``backend-slow-tests`` job (push-to-main only), keeping
          # this critical-path job focused on the ~3k unit/integration tests.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest tests/ -n auto --dist=worksteal --durations=50 -m "not slow"
          else
            pytest tests/ -n auto --dist=worksteal --durations=50 -m "not slow" \
              --cov=app --cov-report=xml --cov-report=html \
              --cov-report=term-missing --cov-fail-under=50
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: github.event_name == 'push'
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        # Only exists on push-to-main runs (PR runs skip --cov for speed).
        if: github.event_name == 'push'
        with:
          name: backend-coverage-report
          path: backend/htmlcov/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Backend Slow Tests (push-to-main only)
  #
  # Runs the ``slow`` pytest marker — currently
  # ``test_dashboard_matviews`` + ``test_rls_coverage``, each of which
  # spawns ``alembic upgrade/downgrade`` subprocesses and consumes
  # 7-10 minutes on its own. Splitting them into a parallel job
  # (instead of bolting onto ``backend-tests``) cuts the push-to-main
  # critical path from ~40 min to ~max(regular, slow) ≈ ~25 min, since
  # both jobs now run concurrently on separate runners.
  #
  # Skipped entirely on PR events — regressions in these guards
  # (migrations + RLS coverage) only land on main, so gating main-push
  # is enough. ``deploy-staging`` still waits on this job so a broken
  # migration or new unprotected tenant-scoped table can't ship.
  # ─────────────────────────────────────────────────────────────
  backend-slow-tests:
    name: Backend Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
          --shm-size 1g

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run slow tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: |
          # -n 2 — the two slow modules each spawn alembic subprocesses
          # and build isolated databases; running them in parallel on a
          # 2-core runner is the sweet spot (more workers would just
          # contend for CPU during the alembic chain). --dist=loadfile
          # keeps each module on a single worker.
          pytest tests/ -n 2 --dist=loadfile --durations=10 -m "slow"
  # On PR: path-filtered (only when frontend src/config changed) — fast feedback.
  # On push to main or manual dispatch: always run — the full pipeline
  # must exercise every suite before a deploy.
  # ─────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # Budget mixes two warning sources: grandfathered max-lines warnings
        # (files >400 LOC) and, since the 2026-04 bump of
        # ``eslint-plugin-react-hooks`` to 6.x, React Compiler
        # ``incompatible-library`` notices on ``react-hook-form`` ``watch()``
        # call sites. Must stay ≤ current count; lower as files are split
        # and ``watch()`` calls migrate to ``useWatch({ control, name })``.
        # See frontend/eslint.config.js comment + audit step 38.
        run: npx eslint src/ --max-warnings 106

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage -- --run --reporter=verbose

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.staging.sonrisa.ventures
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/
          du -sh dist/assets/*.js | sort -rh | head -10
          TOTAL_JS=$(find dist/assets -name '*.js' -exec cat {} + | wc -c)
          TOTAL_KB=$(( TOTAL_JS / 1024 ))
          echo "Total JS: ${TOTAL_KB} KB"
          # Warn at 4.5MB, fail at 6MB (current baseline ~4MB with code splitting)
          if [ "$TOTAL_JS" -gt 6291456 ]; then
            echo "::error::Total JS bundle exceeds 6MB (${TOTAL_KB} KB) — investigate large dependencies"
            exit 1
          elif [ "$TOTAL_JS" -gt 4718592 ]; then
            echo "::warning::Total JS bundle exceeds 4.5MB (${TOTAL_KB} KB) — consider optimizing"
          fi

  # ─────────────────────────────────────────────────────────────
  # OpenAPI schema drift check (runs when either side changed)
  # ─────────────────────────────────────────────────────────────
  schema-drift:
    name: OpenAPI schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev libglib2.0-0 fonts-dejavu-core

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Assert api.generated.ts matches backend schema
        working-directory: frontend
        env:
          # Backend imports get_settings() at module load time; supply the
          # minimum vars needed to validate Settings. Values are throwaway —
          # the script only invokes app.openapi(), never opens a connection.
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: npm run gen:api:check

  # ─────────────────────────────────────────────────────────────
  # Dependency Security Audit (always runs — fast)
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539  # pygments 2.19.2 — no fix available yet

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Scan for vulnerabilities in Dockerfiles
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ─────────────────────────────────────────────────────────────
  # Secrets Scanning (always runs — fast)
  # ─────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────
  # Deploy to Staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    needs: [changes, backend-tests, backend-slow-tests, frontend-tests, schema-drift, security-audit, secrets-scan]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.backend-slow-tests.result == 'success' || needs.backend-slow-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.schema-drift.result == 'success' || needs.schema-drift.result == 'skipped') &&
      needs.security-audit.result == 'success' &&
      needs.secrets-scan.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude 'venv' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            backend/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/backend/

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/frontend/

      - name: Deploy configuration
        run: |
          rsync -avz \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/staging/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/deploy/staging/

      - name: Tag previous images for rollback
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Tag current :latest images as :previous so the rollback-staging
            # job can restore them if E2E later fails. ``docker compose images``
            # prints a table with the Repository in column 2 of row 2 (header
            # is row 1). We parsed via ``--format json`` previously, but
            # Compose v2 returns a JSON *array* that ``head -1`` shreds into
            # ``[`` — python then crashed and $img was silently empty, so
            # :previous tags never got created. Awk on the plain table is
            # format-stable.
            for svc in backend frontend; do
              img=$(docker compose images "$svc" 2>/dev/null | awk 'NR==2 {print $2}')
              echo "Resolved image repo for $svc: '${img:-<empty>}'"
              if [ -n "$img" ]; then
                docker tag "$img:latest" "$img:previous" 2>/dev/null || true
                echo "Tagged $img:latest → $img:previous"
              else
                echo "::warning::Could not resolve image repo for $svc — rollback will have nothing to restore"
              fi
            done
          EOF

      - name: Reset database for PG16 (one-time fix)
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Check if db is healthy — if not, reset the volume for a clean PG16 start
            if ! docker exec saasconf_db_staging pg_isready -U saasconf 2>/dev/null; then
              echo "Database unhealthy — resetting volume for clean PG16 start..."
              docker compose down db 2>/dev/null || true
              docker rm -f saasconf_db_staging 2>/dev/null || true

              # Remove the postgres volume (try all possible prefix names)
              for vol in $(docker volume ls --format '{{.Name}}' | grep postgres_data); do
                echo "Removing volume: $vol"
                docker volume rm "$vol" 2>/dev/null || true
              done

              echo "Volume reset complete. PG16 will start fresh."
            else
              echo "Database is healthy — no reset needed."
            fi
          EOF

      - name: Rebuild and restart containers
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            set -e
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Ensure infrastructure services are running and healthy
            docker compose up -d --wait db redis

            # Rebuild application containers — fail deploy if build fails
            docker compose build --no-cache backend frontend

            # Restart app services only (--no-deps prevents recreating db/redis)
            docker compose up -d --force-recreate --no-deps backend frontend nginx

            # Wait for backend to be healthy before running migrations
            echo "Waiting for backend to be healthy..."
            sleep 30

            # Run database migrations — fail the deploy if migrations fail
            echo "Running database migrations..."
            docker compose exec -T backend alembic upgrade head
          EOF

      - name: Seed platform data
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'SEED_EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging
            echo "Seeding platform data..."
            docker compose exec -T backend python -u -m app.db.seed 2>&1
            echo "Seed exit code: $?"
            echo "Container status:"
            docker compose ps
          SEED_EOF

      - name: Verify containers are running
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            echo "=== Container Status ==="
            docker compose ps

            echo ""
            echo "=== Backend Logs (last 30 lines) ==="
            docker compose logs --tail=30 backend

            echo ""
            echo "=== Nginx Logs (last 15 lines) ==="
            docker compose logs --tail=15 nginx

            echo ""
            echo "=== Local Backend Health Check ==="
            curl -sv http://localhost:8000/health 2>&1 || true

            echo ""
            echo "=== Local Backend via Docker Network ==="
            docker compose exec -T backend curl -sf http://localhost:8000/health || echo "Backend health endpoint unreachable inside container"
          EOF

      - name: Health check
        run: |
          echo "Waiting for services to stabilize..."
          sleep 20

          # Retry health checks up to 8 times with 15s intervals
          for i in 1 2 3 4 5 6 7 8; do
            echo "Health check attempt $i/5..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.staging.sonrisa.ventures/health 2>&1) || true
            echo "  HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend is healthy"
              break
            fi
            if [ "$i" -eq 8 ]; then
              echo "Backend health check failed after 8 attempts"
              echo "=== Full curl output ==="
              curl -sv --max-time 10 https://api.staging.sonrisa.ventures/health 2>&1 || true
              exit 1
            fi
            sleep 15
          done

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://staging.sonrisa.ventures 2>&1) || true
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Frontend is healthy"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Frontend health check failed after 5 attempts (last status: $HTTP_CODE)"
              curl -sv --max-time 10 https://staging.sonrisa.ventures 2>&1 || true
              exit 1
            fi
            sleep 10
          done

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: https://staging.sonrisa.ventures"
          echo "Backend: https://api.staging.sonrisa.ventures"

  # ─────────────────────────────────────────────────────────────
  # E2E Tests (against staging)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [deploy-staging]
    if: |
      always() &&
      needs.deploy-staging.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Create auth storage directory
        working-directory: frontend
        run: mkdir -p playwright/.auth

      - name: Wait for staging to be ready
        run: |
          echo "Waiting for staging API to become ready..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://api.staging.sonrisa.ventures/health/ready || true)
            if [ "$status" = "200" ]; then
              echo "Staging API is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30: API returned $status, waiting 10s..."
            sleep 10
          done
          # Final check
          curl -sf https://api.staging.sonrisa.ventures/health/ready || (echo "API not ready after 5 minutes" && exit 1)

      - name: Wait for staging frontend
        run: |
          echo "Waiting for staging frontend..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://staging.sonrisa.ventures || true)
            if [ "$status" = "200" ]; then
              echo "Frontend is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30: frontend returned $status, waiting 10s..."
            sleep 10
          done
          curl -sf https://staging.sonrisa.ventures || (echo "Frontend not ready after 5 minutes" && exit 1)

      - name: Seed E2E test data
        working-directory: frontend
        env:
          E2E_API_URL: https://api.staging.sonrisa.ventures
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx tsx e2e/seed/setup-staging-data.ts

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://staging.sonrisa.ventures
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
          # E2E_CONFERENCE_ID and E2E_CONFERENCE_NAME are set dynamically
          # by the seed step via GITHUB_ENV — no static secrets needed.
          E2E_API_URL: https://api.staging.sonrisa.ventures
          E2E_PORTAL_PATH: /demo/portal
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Rollback staging on E2E failure
  #
  # Fires when deploy-staging succeeded (new code + containers
  # live on staging) but E2E tests caught a regression. Restores
  # the ``:previous`` image tags that the deploy job captured in
  # its "Tag previous images for rollback" step, then force-
  # recreates backend/frontend/nginx off those older images.
  #
  # Scope: image-tag swap only. DB migrations already ran during
  # deploy and are assumed forward-compatible with the previous
  # code (our migrations are additive). If a rollback needs to
  # also revert DB state, do it manually — auto-reverting
  # migrations is destructive and out of scope here.
  # ─────────────────────────────────────────────────────────────
  rollback-staging:
    name: Rollback Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    needs: [deploy-staging, e2e-tests]
    if: |
      always() &&
      needs.deploy-staging.result == 'success' &&
      needs.e2e-tests.result == 'failure' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Restore :previous image tags
        run: |
          # Pre-compute SHORT_SHA locally so the remote heredoc can be
          # single-quoted (no $-expansion surprises). ``GITHUB_SHA`` is always
          # exported in GH Actions runners.
          SHORT_SHA="${GITHUB_SHA::8}"
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} \
            "export SHORT_SHA='$SHORT_SHA' && bash -s" << 'EOF'
            set -e
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Awk-on-plain-table matches the tag-previous step. Compose v2's
            # --format json returns an array that head -1 reduces to "[",
            # breaking the old python pipe silently — hence rollback never
            # actually ran. Keep the two sites consistent.
            rolled_back=0
            for svc in backend frontend; do
              img=$(docker compose images "$svc" 2>/dev/null | awk 'NR==2 {print $2}')
              echo "Resolved image repo for $svc: '${img:-<empty>}'"
              if [ -z "$img" ]; then
                echo "::warning::Could not resolve image repo for $svc; skipping"
                continue
              fi
              if ! docker image inspect "$img:previous" >/dev/null 2>&1; then
                echo "::warning::No $img:previous tag found — cannot roll back $svc"
                continue
              fi
              # Preserve the broken image under a SHA tag for post-mortem,
              # then swap :previous into :latest so docker compose up picks
              # up the older image.
              docker tag "$img:latest" "$img:failed-$SHORT_SHA" || true
              docker tag "$img:previous" "$img:latest"
              echo "Rolled back $img:latest ← :previous (broken image saved as :failed-$SHORT_SHA)"
              rolled_back=$((rolled_back + 1))
            done

            if [ "$rolled_back" -eq 0 ]; then
              echo "::error::No services were rolled back — :previous tags missing"
              exit 1
            fi

            echo "Restarting app containers off the restored :latest tags..."
            docker compose up -d --force-recreate --no-deps backend frontend nginx
          EOF

      - name: Verify rollback health
        run: |
          echo "Waiting for rolled-back services to come up..."
          sleep 20

          for i in 1 2 3 4 5 6 7 8; do
            echo "Post-rollback health check $i/8..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.staging.sonrisa.ventures/health 2>&1) || true
            echo "  HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend healthy after rollback"
              break
            fi
            if [ "$i" -eq 8 ]; then
              echo "::error::Backend still unhealthy after rollback — staging needs manual intervention"
              exit 1
            fi
            sleep 15
          done

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://staging.sonrisa.ventures 2>&1) || true
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Frontend healthy after rollback"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::Frontend still unhealthy after rollback — staging needs manual intervention"
              exit 1
            fi
            sleep 10
          done

      - name: Notify rollback
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::warning::Staging rolled back to previous release after E2E failure on ${GITHUB_SHA::8}. Investigate and push a fix."
          else
            echo "::error::Rollback attempt FAILED. Staging may be in a degraded state — SSH in and inspect manually."
          fi
