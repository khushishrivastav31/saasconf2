name: Staging CI/CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'RC tag to deploy (e.g. v1.0.0-rc.1). Leave empty to deploy HEAD of main.'
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No STAGING_HOST/USER/PATH env: Ansible reads the target host and app root
# from provision/inventory/, and connects as the user in the inventory.

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Verification gate — single source of truth in _verify.yml.
  # Staging opts into coverage collection; CI does not.
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml

  # ─────────────────────────────────────────────────────────────
  # Build + push images to GitHub Container Registry
  #
  # Images are built HERE, never on the server. The staging host is shared with
  # the Trendig stack and has no business compiling anything.
  #
  # Two tags per image:
  #   :staging  — rolling, what the deploy pulls
  #   :<sha>    — immutable, for rollback without a rebuild
  # ─────────────────────────────────────────────────────────────
  build-images:
    name: Build & push images (ghcr)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    if: needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve build variables from the inventory
        id: vars
        # provision/inventory/domains/staging.ini is the single source of truth
        # for per-environment values. VITE_API_URL is baked into the JS bundle at
        # build time (Vite inlines it), so it cannot be supplied at deploy time —
        # that is why staging and production need distinct frontend image tags.
        run: |
          set -euo pipefail
          INI=provision/inventory/domains/staging.ini
          read_ini() { grep "^$1=" "$INI" | cut -d= -f2-; }

          VITE_API_URL="$(read_ini vite_api_url)"
          BACKEND_IMAGE="$(read_ini ghcr_backend_image)"
          FRONTEND_IMAGE="$(read_ini ghcr_frontend_image)"
          IMAGE_TAG="$(read_ini image_tag)"

          for v in VITE_API_URL BACKEND_IMAGE FRONTEND_IMAGE IMAGE_TAG; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — check $INI"
              exit 1
            fi
          done

          # ghcr rejects uppercase in image paths (the org is "PepeDiaz").
          # `tr`, not ${VAR,,} — the latter needs bash 4+ and is untestable on
          # a bash 3.2 dev machine.
          BACKEND_IMAGE="$(printf '%s' "$BACKEND_IMAGE" | tr '[:upper:]' '[:lower:]')"
          FRONTEND_IMAGE="$(printf '%s' "$FRONTEND_IMAGE" | tr '[:upper:]' '[:lower:]')"

          VERSION="${{ inputs.tag || github.sha }}"
          SHA_TAG="${VERSION//[^a-zA-Z0-9._-]/-}"

          {
            echo "vite_api_url=$VITE_API_URL"
            echo "backend_image=$BACKEND_IMAGE"
            echo "frontend_image=$FRONTEND_IMAGE"
            echo "image_tag=$IMAGE_TAG"
            echo "sha_tag=$SHA_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "backend  → $BACKEND_IMAGE:{$IMAGE_TAG,$SHA_TAG}"
          echo "frontend → $FRONTEND_IMAGE:{$IMAGE_TAG,$SHA_TAG}  (API $VITE_API_URL)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.vars.outputs.backend_image }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.backend_image }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          # No `target:` — the default (last) stage is the full build. The
          # `prebuilt` stage exists only for the old build-on-server flow.
          build-args: |
            VITE_API_URL=${{ steps.vars.outputs.vite_api_url }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }}
            VITE_SENTRY_ENVIRONMENT=staging
            VITE_APP_VERSION=${{ inputs.tag || github.sha }}
          tags: |
            ${{ steps.vars.outputs.frontend_image }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.frontend_image }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        run: |
          {
            echo "### Images pushed to ghcr 📦"
            echo ""
            echo '```'
            echo "${{ steps.vars.outputs.backend_image }}:${{ steps.vars.outputs.image_tag }}"
            echo "${{ steps.vars.outputs.backend_image }}:${{ steps.vars.outputs.sha_tag }}"
            echo "${{ steps.vars.outputs.frontend_image }}:${{ steps.vars.outputs.image_tag }}"
            echo "${{ steps.vars.outputs.frontend_image }}:${{ steps.vars.outputs.sha_tag }}"
            echo '```'
            echo ""
            echo "Frontend built against \`${{ steps.vars.outputs.vite_api_url }}\` (baked in)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # Deploy to Staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    needs: [verify, build-images]
    if: needs.verify.result == 'success' && needs.build-images.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # When dispatched from release_management with an RC tag, deploy that
          # exact commit. On push-to-main this is empty and defaults to HEAD.
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve deploy variables from the inventory
        id: vars
        run: |
          set -euo pipefail
          INI=provision/inventory/domains/staging.ini
          read_ini() { grep "^$1=" "$INI" | cut -d= -f2-; }
          {
            echo "domain=$(read_ini domain)"
            echo "api_domain=$(read_ini api_domain)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install Ansible
        # ansible-core 2.17+: community.docker 5.x does not support 2.16
        # (which is what `ansible==9.*` pins), and docker_compose_v2 needs it.
        run: |
          pip install 'ansible-core==2.17.*'
          ansible-galaxy collection install community.docker

      - name: Deploy with Ansible
        working-directory: provision
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/provision/ansible.cfg
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_ed25519
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_READ_USER: ${{ github.repository_owner }}
          E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
        # Both -i files are required: `inventory = inventory` in ansible.cfg is
        # inert because Ansible's directory inventory skips .ini files.
        run: |
          ansible-playbook -v \
            -i inventory/staging.sonrisa.ventures.ini \
            -i inventory/domains/staging.ini \
            playbooks/saasconf.staging.deploy.yml \
            -e image_tag=${{ needs.build-images.outputs.sha_tag }}

      - name: Health check
        # Public check through host nginx. The playbook already verified both
        # services on their loopback ports; this proves TLS and the vhost.
        env:
          DOMAIN: ${{ steps.vars.outputs.domain }}
          API_DOMAIN: ${{ steps.vars.outputs.api_domain }}
        run: |
          echo "Waiting for services to stabilize..."
          sleep 20

          for i in 1 2 3 4 5 6 7 8; do
            echo "Backend health check attempt $i/8..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${API_DOMAIN}/health" 2>&1) || true
            echo "  HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend is healthy"
              break
            fi
            if [ "$i" -eq 8 ]; then
              echo "Backend health check failed after 8 attempts"
              echo "=== Full curl output ==="
              curl -sv --max-time 10 "https://${API_DOMAIN}/health" 2>&1 || true
              exit 1
            fi
            sleep 15
          done

          for i in 1 2 3 4 5; do
            echo "Frontend health check attempt $i/5..."
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${DOMAIN}" 2>&1) || true
            echo "  HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Frontend is healthy"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Frontend health check failed after 5 attempts (last status: $HTTP_CODE)"
              curl -sv --max-time 10 "https://${DOMAIN}" 2>&1 || true
              exit 1
            fi
            sleep 10
          done

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: https://${{ steps.vars.outputs.domain }}"
          echo "Backend:  https://${{ steps.vars.outputs.api_domain }}"

  # ─────────────────────────────────────────────────────────────
  # E2E Tests (against staging)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [deploy-staging]
    if: |
      always() &&
      needs.deploy-staging.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend

      - name: Resolve staging URLs from the inventory
        id: vars
        run: |
          set -euo pipefail
          INI=provision/inventory/domains/staging.ini
          read_ini() { grep "^$1=" "$INI" | cut -d= -f2-; }
          {
            echo "base_url=https://$(read_ini domain)"
            echo "api_url=https://$(read_ini api_domain)"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Create auth storage directory
        working-directory: frontend
        run: mkdir -p playwright/.auth

      - name: Wait for staging to be ready
        env:
          API_URL: ${{ steps.vars.outputs.api_url }}
        run: |
          echo "Waiting for staging API to become ready..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${API_URL}/health/ready" || true)
            if [ "$status" = "200" ]; then
              echo "Staging API is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30: API returned $status, waiting 10s..."
            sleep 10
          done
          # Final check
          curl -sf "${API_URL}/health/ready" || (echo "API not ready after 5 minutes" && exit 1)

      - name: Wait for staging frontend
        env:
          BASE_URL: ${{ steps.vars.outputs.base_url }}
        run: |
          echo "Waiting for staging frontend..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}" || true)
            if [ "$status" = "200" ]; then
              echo "Frontend is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30: frontend returned $status, waiting 10s..."
            sleep 10
          done
          curl -sf "${BASE_URL}" || (echo "Frontend not ready after 5 minutes" && exit 1)

      - name: Seed E2E test data
        working-directory: frontend
        env:
          E2E_API_URL: ${{ steps.vars.outputs.api_url }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Used by the seed to grant the E2E portal user a CFP committee
          # membership so the role-gated News/Messages sidebar entries are
          # visible during the E2E suite (see PR #182's role gating).
          E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
        run: npx tsx e2e/seed/setup-staging-data.ts

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ steps.vars.outputs.base_url }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
          # E2E_CONFERENCE_ID and E2E_CONFERENCE_NAME are set dynamically
          # by the seed step via GITHUB_ENV — no static secrets needed.
          E2E_API_URL: ${{ steps.vars.outputs.api_url }}
          E2E_PORTAL_PATH: /demo/portal
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Rollback staging on E2E failure
  #
  # Fires when deploy-staging succeeded (new code + containers
  # live on staging) but E2E tests caught a regression. Restores
  # the ``:previous`` image tags that the deploy job captured in
  # its "Tag previous images for rollback" step, then force-
  # recreates backend/frontend/nginx off those older images.
  #
  # Scope: image-tag swap only. DB migrations already ran during
  # deploy and are assumed forward-compatible with the previous
  # code (our migrations are additive). If a rollback needs to
  # also revert DB state, do it manually — auto-reverting
  # migrations is destructive and out of scope here.
  # ─────────────────────────────────────────────────────────────
  rollback-staging:
    name: Rollback Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    needs: [deploy-staging, e2e-tests]
    if: |
      always() &&
      needs.deploy-staging.result == 'success' &&
      needs.e2e-tests.result == 'failure' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve deploy variables from the inventory
        id: vars
        run: |
          set -euo pipefail
          INI=provision/inventory/domains/staging.ini
          read_ini() { grep "^$1=" "$INI" | cut -d= -f2-; }
          {
            echo "domain=$(read_ini domain)"
            echo "api_domain=$(read_ini api_domain)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Install Ansible
        run: |
          pip install 'ansible-core==2.17.*'
          ansible-galaxy collection install community.docker

      - name: Roll back with Ansible
        working-directory: provision
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/provision/ansible.cfg
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_ed25519
        # The deploy playbook tags the running images as :previous before it
        # pulls, so this is a local retag + restart — no registry round-trip.
        run: |
          ansible-playbook -v \
            -i inventory/staging.sonrisa.ventures.ini \
            -i inventory/domains/staging.ini \
            playbooks/saasconf.staging.rollback.yml

      - name: Verify rollback health
        env:
          API_DOMAIN: ${{ steps.vars.outputs.api_domain }}
        run: |
          sleep 15
          for i in 1 2 3 4 5 6; do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${API_DOMAIN}/health" 2>&1) || true
            echo "Rollback health attempt $i/6: $HTTP_CODE"
            [ "$HTTP_CODE" = "200" ] && { echo "Rollback healthy"; exit 0; }
            sleep 10
          done
          echo "::error::Staging is unhealthy after rollback — manual intervention required"
          exit 1

      - name: Notify rollback
        if: always()
        run: |
          {
            echo "## ⏪ Staging rolled back"
            echo ""
            echo "E2E failed against \`${{ github.sha }}\`; the previous images were restored."
            echo ""
            echo "> Migrations are NOT reverted — \`alembic downgrade\` is manual."
          } >> "$GITHUB_STEP_SUMMARY"
