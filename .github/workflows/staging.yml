name: Staging CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  STAGING_HOST: 46.225.88.254
  STAGING_USER: deploy
  STAGING_PATH: /opt/saasconf/app

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend Tests
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # Frontend Tests
  # ─────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage -- --run --reporter=verbose

      - name: Check coverage thresholds
        working-directory: frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage Summary:"
            cat coverage/coverage-summary.json | jq '.total'
          fi

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.staging.sonrisa.ventures
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Dependency Security Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────
  # Deploy to Staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude 'venv' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            backend/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/backend/

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/frontend/

      - name: Deploy configuration
        run: |
          rsync -avz \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/staging/ ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }}:${{ env.STAGING_PATH }}/deploy/staging/

      - name: Rebuild and restart containers
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Rebuild containers
            docker compose build --no-cache backend frontend

            # Restart services with new images
            docker compose up -d --force-recreate backend frontend nginx

            # Wait for backend to be healthy before running migrations
            echo "Waiting for backend to be healthy..."
            sleep 15

            # Run database migrations on new container
            docker compose exec -T backend alembic upgrade head || true

            # Clean up old images
            docker image prune -f

            # Show status
            docker compose ps
          EOF

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 30

          # Check backend health
          curl -f https://api.staging.sonrisa.ventures/health || exit 1
          echo "Backend is healthy"

          # Check frontend
          curl -f https://staging.sonrisa.ventures || exit 1
          echo "Frontend is healthy"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: https://staging.sonrisa.ventures"
          echo "Backend: https://api.staging.sonrisa.ventures"

  # ─────────────────────────────────────────────────────────────
  # E2E Tests (against staging)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Create auth storage directory
        working-directory: frontend
        run: mkdir -p playwright/.auth

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: https://staging.sonrisa.ventures
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
          E2E_CONFERENCE_ID: ${{ secrets.E2E_CONFERENCE_ID }}
          E2E_CONFERENCE_NAME: ${{ secrets.E2E_CONFERENCE_NAME }}
          E2E_API_URL: https://api.staging.sonrisa.ventures
          E2E_PORTAL_PATH: /demo/portal
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
