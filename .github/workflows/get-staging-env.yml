name: Export Staging .env (encrypted)

# Fetches deploy/staging/.env from the staging server and uploads it as an
# AES-256 encrypted artifact. The plaintext never touches the job log or the
# step summary — anyone with repo read access can download artifacts and read
# logs, and this file holds every staging secret (DB password, PII key, SMTP
# credentials, JWT signing key).
#
# Prerequisite: repository secret ENV_EXPORT_PASSPHRASE must be set.
# Decrypt locally with:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
#     -in staging.env.enc -out staging.env -pass env:PASS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-env:
    name: Export staging .env
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require passphrase secret
        env:
          PASS: ${{ secrets.ENV_EXPORT_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::error::ENV_EXPORT_PASSPHRASE is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Fetch and encrypt .env
        env:
          PASS: ${{ secrets.ENV_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Stream straight into openssl: plaintext is never written to disk
          # and never reaches stdout.
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            "cat /opt/saasconf/app/deploy/staging/.env" \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 \
                -pass env:PASS -out staging.env.enc

          if [ ! -s staging.env.enc ]; then
            echo "::error::Encrypted file is empty — .env not found or unreadable on staging."
            exit 1
          fi

          echo "Encrypted $(wc -c < staging.env.enc) bytes."

      - name: Sanity-check round-trip
        env:
          PASS: ${{ secrets.ENV_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Decrypt to /dev/null-ish and count keys, without revealing values.
          KEYS=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
                   -pass env:PASS -in staging.env.enc \
                 | grep -cE '^[A-Z_][A-Z0-9_]*=' || true)
          if [ "$KEYS" -lt 1 ]; then
            echo "::error::Decrypted payload contains no KEY=VALUE lines."
            exit 1
          fi
          echo "Round-trip OK — $KEYS environment keys present."

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-env-encrypted
          path: staging.env.enc
          retention-days: 1

      - name: Summary
        run: |
          {
            echo "### Staging .env exported (encrypted) 🔐"
            echo ""
            echo "Download the \`staging-env-encrypted\` artifact, then decrypt:"
            echo '```bash'
            echo 'read -rs PASS && export PASS'
            echo 'openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \'
            echo '  -in staging.env.enc -out staging.env -pass env:PASS'
            echo '```'
            echo ""
            echo "> Artifact expires in 1 day. Delete \`staging.env\` when finished."
          } >> "$GITHUB_STEP_SUMMARY"
