name: Email Diagnostics — Staging

on:
  workflow_dispatch:

env:
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}
  STAGING_PATH: ${{ secrets.STAGING_PATH }}

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose email on staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Collect diagnostics
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF' >> $GITHUB_STEP_SUMMARY
            cd ${{ env.STAGING_PATH }}/deploy/staging

            # Load staging .env so ${DB_USER} / ${DB_NAME} are available for psql
            set -a; source .env 2>/dev/null || true; set +a

            echo "## Email Diagnostics — Staging"
            echo "_$(date -u)_"
            echo ""

            # ── 1. Container ────────────────────────────────────────────────
            echo "### 1 · Backend container"
            echo '```'
            docker compose ps backend 2>&1 || echo "(docker compose ps failed)"
            echo '```'
            echo ""

            # ── 2. Env vars ─────────────────────────────────────────────────
            echo "### 2 · Email environment"
            echo '```'

            # MAILGUN_API_KEY — system fallback, show presence and length, never the value
            MG_KEY=$(docker exec saasconf_backend_staging printenv MAILGUN_API_KEY 2>/dev/null || true)
            MG_KEY_FILE=$(grep '^MAILGUN_API_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r')
            if [ -n "$MG_KEY" ]; then
              echo "MAILGUN_API_KEY (container): ✅ set (${#MG_KEY} chars)"
            elif [ -n "$MG_KEY_FILE" ]; then
              echo "MAILGUN_API_KEY (container): ❌ not in container — docker-compose.yml missing the var mapping"
              echo "MAILGUN_API_KEY (.env file): ✅ present in .env"
            else
              echo "MAILGUN_API_KEY            : ❌ NOT SET — system fallback disabled, emails only console-logged"
            fi

            MG_DOMAIN=$(docker exec saasconf_backend_staging printenv MAILGUN_DOMAIN 2>/dev/null || true)
            echo "MAILGUN_DOMAIN (container) : ${MG_DOMAIN:-(not set)}"

            # RESEND_API_KEY — per-tenant only; no longer used as a system key
            KEY_CONTAINER=$(docker exec saasconf_backend_staging printenv RESEND_API_KEY 2>/dev/null || true)
            if [ -n "$KEY_CONTAINER" ]; then
              echo "RESEND_API_KEY (container) : set (${#KEY_CONTAINER} chars) — per-tenant use only"
            else
              echo "RESEND_API_KEY             : not set (tenants without own key fall back to Mailgun)"
            fi

            # SMTP_HOST — should be unset in staging
            SMTP=$(docker exec saasconf_backend_staging printenv SMTP_HOST 2>/dev/null || true)
            if [ -z "$SMTP" ]; then
              echo "SMTP_HOST                  : ✅ not set (correct)"
            else
              echo "SMTP_HOST                  : ⚠️  \"$SMTP\" — dev SMTP active, Mailgun bypassed"
            fi

            SENV=$(docker exec saasconf_backend_staging printenv SENTRY_ENVIRONMENT 2>/dev/null || true)
            echo "SENTRY_ENVIRONMENT         : ${SENV:-(not set)}"

            FROM=$(docker exec saasconf_backend_staging printenv MAILGUN_FROM_EMAIL 2>/dev/null || true)
            echo "MAILGUN_FROM_EMAIL         : ${FROM:-(not set)}"
            echo '```'
            echo ""

            # ── 3. Recent log lines ──────────────────────────────────────────
            LOGS=$(docker logs --tail 500 saasconf_backend_staging 2>&1)

            echo "### 3a · Successful sends (last 20)"
            echo '```'
            echo "$LOGS" \
              | grep -E "Email sent to|via system fallback key" \
              | tail -20 \
              || echo "(no successful sends in last 500 log lines)"
            echo '```'
            echo ""

            echo "### 3b · Failed sends (last 20)"
            echo '```'
            echo "$LOGS" \
              | grep -E "Failed to send email|API key is invalid|not_configured|SMTP send failed" \
              | tail -20 \
              || echo "(no failures in last 500 log lines)"
            echo '```'
            echo ""

            echo "### 3c · Fallback warnings (tenant Resend key invalid → Mailgun)"
            echo '```'
            echo "$LOGS" \
              | grep -i "falling back to Mailgun\|Tenant Resend API key invalid" \
              | tail -20 \
              || echo "(no fallback events in last 500 log lines)"
            echo '```'
            echo ""

            # ── 4. DB failure records ────────────────────────────────────────
            echo "### 4a · email_logs status summary (last 24 h)"
            echo '```'
            docker compose exec -T db \
              psql -U "${DB_USER:-saasconf}" -d "${DB_NAME:-saasconf}" \
              -c "SELECT status, COUNT(*) AS count FROM email_logs WHERE created_at > now() - interval '24 hours' GROUP BY status ORDER BY count DESC;" \
              2>&1 || echo "(could not query — DB container may not be healthy)"
            echo '```'
            echo ""

            echo "### 4b · Recent failure records (last 10)"
            echo '```'
            docker compose exec -T db \
              psql -U "${DB_USER:-saasconf}" -d "${DB_NAME:-saasconf}" -x \
              -c "SELECT email_type, status, error_message, recipient_email, created_at FROM email_logs WHERE status != 'sent' ORDER BY created_at DESC LIMIT 10;" \
              2>&1 || echo "(could not query — DB container may not be healthy)"
            echo '```'
          EOF
