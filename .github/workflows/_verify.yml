name: Verify

# Reusable verification workflow — called by ci.yml (PRs) and staging.yml (deploy gate).
# All shared jobs live here. Change this file once; both callers pick it up.
on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend Lint + Type check
  # ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend

      - name: Lint with Ruff
        working-directory: backend
        run: |
          ruff check app/
          ruff format --check app/

      - name: Cache mypy results
        uses: actions/cache@v6
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-py3.13-${{ hashFiles('backend/requirements.txt', 'backend/pyproject.toml') }}
          restore-keys: mypy-${{ runner.os }}-py3.13-

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --config-file=pyproject.toml

  # ─────────────────────────────────────────────────────────────
  # Backend Tests — 4 parallel shards
  # ─────────────────────────────────────────────────────────────
  backend-test-shard:
    name: Backend Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            dirs: tests/core tests/auth
          - shard: 2
            dirs: tests/trainings
          - shard: 3
            dirs: tests/invoices tests/registrations
          - shard: 4
            dirs: tests/conferences tests/cfp tests/cfp_portal tests/messaging tests/gdpr

    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
          --shm-size 1g

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: pytest ${{ matrix.dirs }} -n auto --dist=worksteal --durations=50 -m "not slow"

  # ─────────────────────────────────────────────────────────────
  # Backend Tests — summary gate
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-test-shard
    if: always()

    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.backend-test-shard.result }}" != "success" ]]; then
            echo "Backend tests failed."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Backend Slow Tests — always runs
  # ─────────────────────────────────────────────────────────────
  backend-slow-tests:
    name: Backend Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1g
          --shm-size 1g

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend

      - name: Run slow tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: pytest tests/ -n 2 --dist=loadfile --durations=10 -m "slow"

  # ─────────────────────────────────────────────────────────────
  # Frontend Lint + Type check + Build
  # ─────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend

      - name: Lint
        working-directory: frontend
        # Ceiling ratchets down as files are split under the max-lines rule
        # (MAIN-13428). Current count is 89; lower this whenever it drops further.
        run: pnpm exec eslint src/ --max-warnings 90

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Resolve VITE_API_URL from the inventory
        id: vite
        # provision/inventory/domains/staging.ini is the single source of truth
        # for per-environment values. This build is thrown away (type-check,
        # lint, bundle size) — the URL is only inlined so the bundle matches
        # what staging actually ships.
        run: |
          set -euo pipefail
          URL="$(grep '^vite_api_url=' provision/inventory/domains/staging.ini | cut -d= -f2-)"
          if [ -z "$URL" ]; then
            echo "::error::vite_api_url is empty in provision/inventory/domains/staging.ini"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.vite.outputs.url }}
        run: pnpm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/
          du -sh dist/assets/*.js | sort -rh | head -10
          TOTAL_JS=$(find dist/assets -name '*.js' -exec cat {} + | wc -c)
          TOTAL_KB=$(( TOTAL_JS / 1024 ))
          echo "Total JS: ${TOTAL_KB} KB"
          if [ "$TOTAL_JS" -gt 6291456 ]; then
            echo "::error::Total JS bundle exceeds 6MB (${TOTAL_KB} KB) — investigate large dependencies"
            exit 1
          elif [ "$TOTAL_JS" -gt 4718592 ]; then
            echo "::warning::Total JS bundle exceeds 4.5MB (${TOTAL_KB} KB) — consider optimizing"
          fi

  # ─────────────────────────────────────────────────────────────
  # Frontend Tests — 3 parallel shards
  # ─────────────────────────────────────────────────────────────
  frontend-test-shard:
    name: Frontend Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend

      - name: Run tests
        working-directory: frontend
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  # ─────────────────────────────────────────────────────────────
  # Frontend Tests — summary gate
  # ─────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-test-shard
    if: always()

    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.frontend-test-shard.result }}" != "success" ]]; then
            echo "Frontend tests failed."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # OpenAPI schema drift
  # ─────────────────────────────────────────────────────────────
  schema-drift:
    name: OpenAPI schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend

      - name: Assert api.generated.ts matches backend schema
        working-directory: frontend
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: pnpm run gen:api:check

  # ─────────────────────────────────────────────────────────────
  # Dependency Security Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # TODO: Remove --ignore-vuln PYSEC-2025-183 once PyJWT ships a release that closes
          # the OSV advisory. Snyk shows 2.12.1 as clean; vendor disputes the finding; and
          # our app already enforces a 32-char minimum key in config.py — we are not exposed.
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln PYSEC-2025-183

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      # No `cache: 'pnpm'` here — pnpm audit never calls pnpm install so the
      # store stays empty and setup-node's post-job cache save would fail with
      # "Path Validation Error", marking the whole job failed.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level=critical

      - name: Scan for vulnerabilities in Dockerfiles
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ─────────────────────────────────────────────────────────────
  # Secrets Scanning
  # ─────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.97.6
        with:
          extra_args: --only-verified
