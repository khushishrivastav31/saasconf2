name: Scheduled Backup

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}
  STAGING_PATH: ${{ secrets.STAGING_PATH }}

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Run backup
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'ENDSSH'
            cd ${{ env.STAGING_PATH }}/deploy/staging
            ./backup.sh
          ENDSSH

      - name: Collect backup report
        id: report
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'ENDSSH' > backup_report.txt 2>&1
            echo "=== Recent Backups ==="
            ls -lht /opt/saasconf/backups/ 2>/dev/null | head -20 || echo "No backups found"
            echo ""
            echo "=== Disk Usage ==="
            du -sh /opt/saasconf/backups/ 2>/dev/null || echo "N/A"
            echo ""
            echo "=== Host Disk Space ==="
            df -h /opt/saasconf/ 2>/dev/null || df -h / 2>/dev/null
          ENDSSH
          cat backup_report.txt

      - name: Upload backup report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-report-${{ github.run_id }}
          path: backup_report.txt
          retention-days: 30

      - name: Alert on backup failure
        if: failure()
        run: |
          echo "::error::Backup failed! Check logs above for details."
          echo "Backup failure at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Review the workflow run at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

      - name: Backup summary
        if: success()
        run: |
          echo "## Backup Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recent Backups" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat backup_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
