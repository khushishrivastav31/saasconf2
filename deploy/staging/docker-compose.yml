services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: saasconf_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-saasconf}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-saasconf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saasconf} -d ${DB_NAME:-saasconf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasconf_network

  # Redis for token blacklist and caching
  redis:
    image: redis:7-alpine
    container_name: saasconf_redis_staging
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saasconf_network

  # FastAPI Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: saasconf_backend_staging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-saasconf}:${DB_PASSWORD}@db:5432/${DB_NAME:-saasconf}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      DEBUG: "false"
      CORS_ORIGINS: '["https://${DOMAIN}", "https://www.${DOMAIN}"]'
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@sonrisa.ventures}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saasconf_network

  # React Frontend (Nginx)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        VITE_SENTRY_ENVIRONMENT: staging
        VITE_APP_VERSION: ${APP_VERSION:-0.1.0}
    container_name: saasconf_frontend_staging
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - saasconf_network

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: saasconf_nginx_staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - saasconf_network
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # Certbot for SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: saasconf_certbot_staging
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - saasconf_network

networks:
  saasconf_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
