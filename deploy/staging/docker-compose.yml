services:
  # PostgreSQL Database
  db:
    # postgres:16.13-alpine
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: saasconf_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-saasconf}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-saasconf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saasconf} -d ${DB_NAME:-saasconf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - saasconf_network

  # Redis for token blacklist and caching
  redis:
    # redis:7.4.9-alpine
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: saasconf_redis_staging
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - saasconf_network

  # FastAPI Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: saasconf_backend_staging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-saasconf}:${DB_PASSWORD}@db:5432/${DB_NAME:-saasconf}
      DATABASE_SSL_REQUIRED: ${DATABASE_SSL_REQUIRED:-false}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      PII_ENCRYPTION_KEYS_OLD: ${PII_ENCRYPTION_KEYS_OLD:-}
      DEBUG: "false"
      CORS_ORIGINS: '["https://${DOMAIN}", "https://www.${DOMAIN}"]'
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      OPS_API_KEY: ${OPS_API_KEY}
      # Override for E2E: Playwright tests run from a single GHA IP and would trip the prod-safe default
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-30/minute}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@sonrisa.ventures}
      FRONTEND_BASE_URL: https://${DOMAIN}
      PORTAL_BASE_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - saasconf_network

  # React Frontend (Nginx)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://api.${DOMAIN}
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        VITE_SENTRY_ENVIRONMENT: staging
        VITE_APP_VERSION: ${APP_VERSION:-0.1.0}
    container_name: saasconf_frontend_staging
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - saasconf_network

  # Nginx Reverse Proxy with SSL
  nginx:
    # nginx:1.27-alpine
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: saasconf_nginx_staging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: api.${DOMAIN}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - saasconf_network
    command: '/bin/sh -c ''envsubst "\$$DOMAIN \$$API_DOMAIN" < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # Nightly data retention cleanup (expired tokens, old audit logs)
  cleanup-cron:
    image: curlimages/curl:8.20.0
    container_name: saasconf_cleanup_cron
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      OPS_API_KEY: ${OPS_API_KEY}
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 86400; echo \"Running data retention cleanup...\"; curl -sf -X POST -H \"Authorization: Bearer $${OPS_API_KEY}\" http://backend:8000/ops/data-retention-cleanup || echo \"Cleanup failed\"; done;'"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    networks:
      - saasconf_network

  # Hourly deadline reminder emails
  deadline-cron:
    image: curlimages/curl:8.20.0
    container_name: saasconf_deadline_cron
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      OPS_API_KEY: ${OPS_API_KEY}
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 3600; echo \"Sending deadline reminders...\"; curl -sf -X POST -H \"Authorization: Bearer $${OPS_API_KEY}\" http://backend:8000/ops/send-deadline-reminders || echo \"Deadline reminders failed\"; done;'"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    networks:
      - saasconf_network

  # Daily payment reminder emails (overdue invoices)
  payment-reminder-cron:
    image: curlimages/curl:8.20.0
    container_name: saasconf_payment_reminder_cron
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      OPS_API_KEY: ${OPS_API_KEY}
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 86400; echo \"Sending payment reminders...\"; curl -sf -X POST -H \"Authorization: Bearer $${OPS_API_KEY}\" http://backend:8000/ops/send-payment-reminders || echo \"Payment reminders failed\"; done;'"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
    networks:
      - saasconf_network

  # Certbot for SSL certificate renewal
  certbot:
    image: certbot/certbot:v5.6.0
    container_name: saasconf_certbot_staging
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - saasconf_network

networks:
  saasconf_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
